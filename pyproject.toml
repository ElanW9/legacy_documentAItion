[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docgen"
version = "0.1.0"
description = "AI-generated, code-grounded documentation for legacy PL/SQL, published to Confluence"
requires-python = ">=3.12"
dependencies = [
    "google-genai==2.33.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The prompts are part of the generator: install them with the code.
docgen = ["prompts/VERSION", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error",
    # google-genai 2.33.0 on Python 3.14; third-party, harmless until Python 3.17.
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["docgen", "tests"]
