# Regenerate and publish Confluence pages for the PL/SQL packages changed by a
# push to main. Manual runs can regenerate everything (full_run). Pull requests
# get an offline dry-run (fake LLM, no secrets) with the rendered pages as an
# artifact, so a reviewer can see the page layout before merging.
#
# Secrets (Settings > Secrets and variables > Actions > Secrets):
#   GEMINI_API_KEY, OPENROUTER_API_KEY (only with LLM_PROVIDER=openrouter),
#   ATLASSIAN_EMAIL, ATLASSIAN_TOKEN
# Variables (same page, Variables tab; not sensitive):
#   LLM_PROVIDER (default gemini), GEMINI_MODEL, OPENROUTER_MODEL,
#   PUBLISH_MODE (default rest), CONFLUENCE_SITE, CONFLUENCE_SPACE, CONFLUENCE_PARENT_ID
name: generate-docs

on:
  push:
    branches: [main]
    paths: ["plsql/**", "scripts/**"]
  pull_request:
    paths: ["plsql/**", "scripts/**"]
  workflow_dispatch:
    inputs:
      full_run:
        description: "Regenerate every page, also the ones that are up to date"
        type: boolean
        default: false

permissions:
  contents: read

# One publish at a time; a newer push waits instead of cancelling a run that is
# halfway through updating pages.
concurrency:
  group: generate-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  publish:
    name: generate and publish
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the diff against the previous push is always possible.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .

      - name: Select packages
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FULL_RUN: ${{ inputs.full_run }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/select-packages.sh

      # Validated LLM answers, keyed by a hash of the full request: a re-run after
      # a quota or overload failure does not pay again for packages that succeeded.
      - name: Restore LLM response cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/docgen
          key: docgen-llm-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: docgen-llm-

      - name: Generate and publish
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_TOKEN: ${{ secrets.ATLASSIAN_TOKEN }}
          CONFLUENCE_SITE: ${{ vars.CONFLUENCE_SITE }}
          CONFLUENCE_SPACE: ${{ vars.CONFLUENCE_SPACE }}
          CONFLUENCE_PARENT_ID: ${{ vars.CONFLUENCE_PARENT_ID }}
          SOURCE_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/blob
        run: python -m docgen run ${{ steps.select.outputs.args }} --report report.md

      - name: Save LLM response cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/docgen
          key: docgen-llm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run report
        if: always()
        run: |
          if [ -f report.md ]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report: the run stopped before processing (see the log)." >> "$GITHUB_STEP_SUMMARY"
          fi

  dry-run:
    name: dry-run (fake LLM)
    if: github.event_name == 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Select packages
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/select-packages.sh
      - name: Render changed packages
        # No secrets: works for pull requests from forks, spends no LLM quota.
        env:
          LLM_PROVIDER: fake
        run: >-
          python -m docgen run ${{ steps.select.outputs.args }}
          --dry-run --out out --report out/report.md
      - name: Run report
        if: always()
        run: |
          [ -f out/report.md ] && cat out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: docs-dry-run
          path: out/
          if-no-files-found: ignore
          retention-days: 7
